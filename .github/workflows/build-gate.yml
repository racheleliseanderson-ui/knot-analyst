name: Build gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        continue-on-error: true
        run: bun run lint

      - name: Data + schema regression
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: End-to-end smoke (production build, worker runtime)
        run: bun run e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
