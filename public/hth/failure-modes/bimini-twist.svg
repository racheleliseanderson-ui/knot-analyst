<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">Bimini Twist advanced failure modes</title>
<desc id="desc">Four advanced failure modes for Bimini Twist: symptom, cause, action, and severity.</desc>
<style>
  .bg{fill:#F7F5EF}.panel{fill:#fff;stroke:#D8D4CA;stroke-width:2}
  .title{font:800 28px system-ui,sans-serif;fill:#071827}
  .kicker{font:700 12px system-ui,sans-serif;fill:#176F78;letter-spacing:.12em}
  .head{font:700 14px system-ui,sans-serif;fill:#fff;letter-spacing:.08em}
  .mode-title{font:800 18px system-ui,sans-serif;fill:#071827;text-transform:capitalize}
  .label{font:700 11px system-ui,sans-serif;fill:#5E6A71;letter-spacing:.08em}
  .body{font:500 14px system-ui,sans-serif;fill:#12202B}
  .footer{font:600 12px system-ui,sans-serif;fill:#5E6A71}
</style>
<rect class="bg" width="1160" height="720"/>
<text x="40" y="42" class="kicker">HOOK THE HORIZON · ADVANCED FAILURE MODES</text>
<text x="40" y="78" class="title">Bimini Twist — what fails and what to do</text>

<rect x="30" y="110" width="535" height="260" rx="16" class="panel"/>
<rect x="30" y="110" width="535" height="44" rx="16" fill="#0F5660"/>
<rect x="30" y="138" width="535" height="16" fill="#0F5660"/>
<text x="50" y="140" class="head">CONSTRUCTION</text>
<text x="50" y="182" class="mode-title">loose twist column</text>
<text x="50" y="214" class="label">SYMPTOM</text>
<text x="50" y="236" class="body">Twist column shows gaps or loose sections.</text>
<text x="50" y="266" class="label">CAUSE</text>
<text x="50" y="288" class="body">Insufficient tension during the initial twists.</text>
<text x="50" y="318" class="label">ACTION · twist collapse</text>
<text x="50" y="340" class="body">Retie under continuous tension; keep legs even.</text>
<rect x="595" y="110" width="535" height="260" rx="16" class="panel"/>
<rect x="595" y="110" width="535" height="44" rx="16" fill="#176F78"/>
<rect x="595" y="138" width="535" height="16" fill="#176F78"/>
<text x="615" y="140" class="head">SEATING</text>
<text x="615" y="182" class="mode-title">stacked reverse wraps</text>
<text x="615" y="214" class="label">SYMPTOM</text>
<text x="615" y="236" class="body">Reverse wraps stack or jump instead of progressing.</text>
<text x="615" y="266" class="label">CAUSE</text>
<text x="615" y="288" class="body">Loss of tension while transitioning to reverse wraps.</text>
<text x="615" y="318" class="label">ACTION · uneven load</text>
<text x="615" y="340" class="body">Maintain tension; re-wrap reverse series cleanly.</text>
<rect x="30" y="400" width="535" height="260" rx="16" class="panel"/>
<rect x="30" y="400" width="535" height="44" rx="16" fill="#8C3426"/>
<rect x="30" y="428" width="535" height="16" fill="#8C3426"/>
<text x="50" y="430" class="head">LOAD PATH</text>
<text x="50" y="472" class="mode-title">uneven legs</text>
<text x="50" y="504" class="label">SYMPTOM</text>
<text x="50" y="526" class="body">One loop leg bears visibly more load.</text>
<text x="50" y="556" class="label">CAUSE</text>
<text x="50" y="578" class="body">Asymmetric finishing or uneven initial legs.</text>
<text x="50" y="608" class="label">ACTION · single-leg failure</text>
<text x="50" y="630" class="body">Equalize legs before final locks; retie if already set wrong.</text>
<rect x="595" y="400" width="535" height="260" rx="16" class="panel"/>
<rect x="595" y="400" width="535" height="44" rx="16" fill="#D55C3E"/>
<rect x="595" y="428" width="535" height="16" fill="#D55C3E"/>
<text x="615" y="430" class="head">MISAPPLICATION</text>
<text x="615" y="472" class="mode-title">wrong job</text>
<text x="615" y="504" class="label">SYMPTOM</text>
<text x="615" y="526" class="body">Used as a terminal to a lure eye.</text>
<text x="615" y="556" class="label">CAUSE</text>
<text x="615" y="578" class="body">Double-line loop job confused with terminal eye job.</text>
<text x="615" y="608" class="label">ACTION · system mismatch</text>
<text x="615" y="630" class="body">Use Bimini for double-line/system building; pick a terminal knot for the eye.</text>
<text x="40" y="700" class="footer">Symptom → cause → action. Finished-state plates still apply for correct vs wrong visual checks.</text>
</svg>

