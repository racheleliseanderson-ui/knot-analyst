<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">Bristol Knot advanced failure modes</title>
<desc id="desc">Four advanced failure modes for Bristol Knot: symptom, cause, action, and severity.</desc>
<style>
  .bg{fill:#F7F5EF}.panel{fill:#fff;stroke:#D8D4CA;stroke-width:2}
  .title{font:800 28px system-ui,sans-serif;fill:#071827}
  .kicker{font:700 12px system-ui,sans-serif;fill:#176F78;letter-spacing:.12em}
  .head{font:700 14px system-ui,sans-serif;fill:#fff;letter-spacing:.08em}
  .mode-title{font:800 18px system-ui,sans-serif;fill:#071827;text-transform:capitalize}
  .label{font:700 11px system-ui,sans-serif;fill:#5E6A71;letter-spacing:.08em}
  .body{font:500 14px system-ui,sans-serif;fill:#12202B}
  .footer{font:600 12px system-ui,sans-serif;fill:#5E6A71}
</style>
<rect class="bg" width="1160" height="720"/>
<text x="40" y="42" class="kicker">HOOK THE HORIZON · ADVANCED FAILURE MODES</text>
<text x="40" y="78" class="title">Bristol Knot — what fails and what to do</text>

<rect x="30" y="110" width="535" height="260" rx="16" class="panel"/>
<rect x="30" y="110" width="535" height="44" rx="16" fill="#0F5660"/>
<rect x="30" y="138" width="535" height="16" fill="#0F5660"/>
<text x="50" y="140" class="head">CONSTRUCTION</text>
<text x="50" y="182" class="mode-title">too few wraps</text>
<text x="50" y="214" class="label">SYMPTOM</text>
<text x="50" y="236" class="body">Wrap column looks short or sparse for the line.</text>
<text x="50" y="266" class="label">CAUSE</text>
<text x="50" y="288" class="body">Under-counted wraps for the material.</text>
<text x="50" y="318" class="label">ACTION · slip</text>
<text x="50" y="340" class="body">Retie with the profile wrap count for that material.</text>
<rect x="595" y="110" width="535" height="260" rx="16" class="panel"/>
<rect x="595" y="110" width="535" height="44" rx="16" fill="#176F78"/>
<rect x="595" y="138" width="535" height="16" fill="#176F78"/>
<text x="615" y="140" class="head">SEATING</text>
<text x="615" y="182" class="mode-title">angled exit</text>
<text x="615" y="214" class="label">SYMPTOM</text>
<text x="615" y="236" class="body">Leader exits at a sharp angle from the wraps.</text>
<text x="615" y="266" class="label">CAUSE</text>
<text x="615" y="288" class="body">Not drawn in-line while seating.</text>
<text x="615" y="318" class="label">ACTION · cut</text>
<text x="615" y="340" class="body">Seat wraps so the exit continues the line of pull.</text>
<rect x="30" y="400" width="535" height="260" rx="16" class="panel"/>
<rect x="30" y="400" width="535" height="44" rx="16" fill="#C7A257"/>
<rect x="30" y="428" width="535" height="16" fill="#C7A257"/>
<text x="50" y="430" class="head">MATERIAL</text>
<text x="50" y="472" class="mode-title">diameter mismatch</text>
<text x="50" y="504" class="label">SYMPTOM</text>
<text x="50" y="526" class="body">Heavy braid digs into light leader under wraps.</text>
<text x="50" y="556" class="label">CAUSE</text>
<text x="50" y="578" class="body">Diameter gap too large for this family.</text>
<text x="50" y="608" class="label">ACTION · leader damage</text>
<text x="50" y="630" class="body">Step diameters or use a different join family.</text>
<rect x="595" y="400" width="535" height="260" rx="16" class="panel"/>
<rect x="595" y="400" width="535" height="44" rx="16" fill="#5E6A71"/>
<rect x="595" y="428" width="535" height="16" fill="#5E6A71"/>
<text x="615" y="430" class="head">SERVICE</text>
<text x="615" y="472" class="mode-title">wrap creep</text>
<text x="615" y="504" class="label">SYMPTOM</text>
<text x="615" y="526" class="body">Wraps loosen after hard runs.</text>
<text x="615" y="556" class="label">CAUSE</text>
<text x="615" y="578" class="body">Insufficient seat or wet-draw.</text>
<text x="615" y="608" class="label">ACTION · slip</text>
<text x="615" y="630" class="body">Re-seat under progressive load; retie if wraps open.</text>
<text x="40" y="700" class="footer">Symptom → cause → action. Finished-state plates still apply for correct vs wrong visual checks.</text>
</svg>

