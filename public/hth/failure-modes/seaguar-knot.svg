<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">Seaguar Knot advanced failure modes</title>
<desc id="desc">Four advanced failure modes for Seaguar Knot: symptom, cause, action, and severity.</desc>
<style>
  .bg{fill:#F7F5EF}.panel{fill:#fff;stroke:#D8D4CA;stroke-width:2}
  .title{font:800 28px system-ui,sans-serif;fill:#071827}
  .kicker{font:700 12px system-ui,sans-serif;fill:#176F78;letter-spacing:.12em}
  .head{font:700 14px system-ui,sans-serif;fill:#fff;letter-spacing:.08em}
  .mode-title{font:800 18px system-ui,sans-serif;fill:#071827;text-transform:capitalize}
  .label{font:700 11px system-ui,sans-serif;fill:#5E6A71;letter-spacing:.08em}
  .body{font:500 14px system-ui,sans-serif;fill:#12202B}
  .footer{font:600 12px system-ui,sans-serif;fill:#5E6A71}
</style>
<rect class="bg" width="1160" height="720"/>
<text x="40" y="42" class="kicker">HOOK THE HORIZON · ADVANCED FAILURE MODES</text>
<text x="40" y="78" class="title">Seaguar Knot — what fails and what to do</text>

<rect x="30" y="110" width="535" height="260" rx="16" class="panel"/>
<rect x="30" y="110" width="535" height="44" rx="16" fill="#0F5660"/>
<rect x="30" y="138" width="535" height="16" fill="#0F5660"/>
<text x="50" y="140" class="head">CONSTRUCTION</text>
<text x="50" y="182" class="mode-title">uneven twist</text>
<text x="50" y="214" class="label">SYMPTOM</text>
<text x="50" y="236" class="body">One side twists more than the other.</text>
<text x="50" y="266" class="label">CAUSE</text>
<text x="50" y="288" class="body">Uneven hand tension while twisting.</text>
<text x="50" y="318" class="label">ACTION · weak joint</text>
<text x="50" y="340" class="body">Retie with matched twist counts.</text>
<rect x="595" y="110" width="535" height="260" rx="16" class="panel"/>
<rect x="595" y="110" width="535" height="44" rx="16" fill="#D55C3E"/>
<rect x="595" y="138" width="535" height="16" fill="#D55C3E"/>
<text x="615" y="140" class="head">MISAPPLICATION</text>
<text x="615" y="182" class="mode-title">wrong material</text>
<text x="615" y="214" class="label">SYMPTOM</text>
<text x="615" y="236" class="body">Braid used where mono-main is required.</text>
<text x="615" y="266" class="label">CAUSE</text>
<text x="615" y="288" class="body">System misapplication.</text>
<text x="615" y="318" class="label">ACTION · failure</text>
<text x="615" y="340" class="body">Use the verified material pairing for this knot.</text>
<rect x="30" y="400" width="535" height="260" rx="16" class="panel"/>
<rect x="30" y="400" width="535" height="44" rx="16" fill="#176F78"/>
<rect x="30" y="428" width="535" height="16" fill="#176F78"/>
<text x="50" y="430" class="head">SEATING</text>
<text x="50" y="472" class="mode-title">cutting angle</text>
<text x="50" y="504" class="label">SYMPTOM</text>
<text x="50" y="526" class="body">Finished junction shows a sharp cutting angle.</text>
<text x="50" y="556" class="label">CAUSE</text>
<text x="50" y="578" class="body">Not drawn square.</text>
<text x="50" y="608" class="label">ACTION · cut</text>
<text x="50" y="630" class="body">Seat so the join is compact and square.</text>
<rect x="595" y="400" width="535" height="260" rx="16" class="panel"/>
<rect x="595" y="400" width="535" height="44" rx="16" fill="#5E6A71"/>
<rect x="595" y="428" width="535" height="16" fill="#5E6A71"/>
<text x="615" y="430" class="head">SERVICE</text>
<text x="615" y="472" class="mode-title">abrasion</text>
<text x="615" y="504" class="label">SYMPTOM</text>
<text x="615" y="526" class="body">Outer strands abrade after guide contact.</text>
<text x="615" y="556" class="label">CAUSE</text>
<text x="615" y="578" class="body">Bulky twist on small guides.</text>
<text x="615" y="608" class="label">ACTION · abrasion</text>
<text x="615" y="630" class="body">Dress tags; consider a slimmer join.</text>
<text x="40" y="700" class="footer">Symptom → cause → action. Finished-state plates still apply for correct vs wrong visual checks.</text>
</svg>

